<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>card-camaleão</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="card">
        <div class="conteudo">
            <div class="textos">
                <div class="title">⚡ Temporada 04 Ativa</div>
                <div class="texto-princ">CyberStrike: Arena do Futuro</div>
                <div class="texto-sec">Monte seu Esquadrão cibernetico, dispute torneios semanais <br> domine os
                    servidores de alta
                    performace com taxas de 144 FPS e premiações exclusivas.
                </div>
            </div>


            <div class="caixa">
                <div class="box">🛡️ Anti-cheat</div>
                <div class="box">⚡ 128 Tick</div>
                <div class="box">🏆 Ranqueado</div>
            </div>

            <div>
                <button type="button">JOGAR AGORA ⚔️</button>
            </div>
        </div>
        <div class="image">
            <img src="imagens/Captura de tela 2026-11-17 194537.png"
                alt="Desenho estilizado de um controle de video-game">
        </div>
    </div>
</body>

</html>
